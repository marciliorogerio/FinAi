<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#finGrad)" />
  
  <!-- Robot & Financial Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(64, 64)">
    <!-- Bot Head -->
    <rect x="76" y="96" width="232" height="192" rx="40" fill="#10b981" fill-opacity="0.25" stroke="#ffffff" />
    <!-- Bot Antenna -->
    <line x1="192" y1="40" x2="192" y2="96" />
    <circle cx="192" cy="32" r="14" fill="#ffffff" />
    <!-- Bot Ears -->
    <rect x="52" y="156" width="24" height="60" rx="8" fill="#ffffff" />
    <rect x="308" y="156" width="24" height="60" rx="8" fill="#ffffff" />
    <!-- Bot Eyes -->
    <circle cx="140" cy="176" r="22" fill="#ffffff" stroke="none" />
    <circle cx="244" cy="176" r="22" fill="#ffffff" stroke="none" />
    <circle cx="146" cy="172" r="8" fill="#047857" stroke="none" />
    <circle cx="250" cy="172" r="8" fill="#047857" stroke="none" />
    <!-- Bot Mouth/Chart -->
    <path d="M130 240 Q192 270 254 240" stroke="#ffffff" stroke-width="20" />
    
    <!-- Growth Sparkle Badge -->
    <path d="M310 70 L325 30 L340 70 L380 85 L340 100 L325 140 L310 100 L270 85 Z" fill="url(#sparkleGrad)" stroke="#f59e0b" stroke-width="6" />
    
    <!-- Currency Coin Badge -->
    <circle cx="192" cy="336" r="38" fill="#f59e0b" stroke="#ffffff" stroke-width="12" />
    <text x="192" y="348" font-family="sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" stroke="none">R$</text>
  </g>
</svg>
